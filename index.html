<style>
:root{--r:#e52b2f;--r2:#f6c9ca;--bg:#f2f2f4;--ink:#222;--mut:#777;--line:#e3e3e6;--g:#1f9d44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:15px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input{font:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

.cal table{width:100%;border-collapse:collapse;table-layout:fixed}

/* まだ✓してないセット（前回の写し）は数字を薄く＝どこまでやったか一目で分かる。✓したら黒 */

.hcal table{width:100%;background:#fff;border-collapse:collapse;table-layout:fixed}
.hcal td,.hcal th{text-align:center;padding:3px 0;font-size:14px}
.hcal td{height:48px}
.hcal td span{display:inline-flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center}
.hcal td.o{color:#bbb}

.hcal .mh{display:flex;justify-content:space-between;align-items:center;padding:0 6px;background:#fff;font-weight:700}
.hcal .mh button{color:var(--r);font-size:24px;width:48px;height:48px}
.gbox{background:#fff;margin:10px;border-radius:10px;padding:8px}
.gbox h4{margin:2px 4px 2px;font-size:14px}
.gbox .more{text-align:right;color:var(--r);font-size:14px;min-height:36px;padding:8px 4px 0}
.gbox .chg{margin:0 4px 4px;font-size:13px;color:var(--mut)}
.gbox .chg b{color:var(--g);font-size:15px}
.gbox .chg b.dn{color:var(--r)}
svg.g{width:100%;height:170px}
.form{background:#fff;margin:10px;border-radius:10px}
.form label{display:flex;align-items:center;padding:6px 12px;min-height:52px;border-top:1px solid var(--line);gap:10px}
.form label:first-child{border-top:0}
.form label span{width:80px;color:var(--mut)}
.form input,.form select{flex:1;border:0;font-size:17px;padding:8px 4px;min-height:44px;background:transparent}
.btn{display:block;width:calc(100% - 20px);margin:10px;padding:13px;min-height:52px;border-radius:12px;background:var(--r);color:#fff;font-weight:700;font-size:17px}
.btn.w{background:#fff;color:var(--r);border:1.5px solid var(--r)}
.warn{color:var(--r);font-size:13px;padding:0 14px}
.sugg button{display:block;width:100%;text-align:left;padding:0 12px;min-height:48px;border-top:1px solid var(--line);background:#fff}
#act{display:none;gap:8px;padding:6px 10px;background:#fff;border-top:1px solid var(--line)}
#act .btn{margin:0;width:auto;flex:1.3}
#act .btn.w{flex:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#toast.on{opacity:1}
.search{margin:10px;display:flex;gap:8px}
.search input{flex:1;border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px;font-size:16px;background:#fff}
.search button{color:var(--r);font-weight:700;border:1.5px solid var(--r);border-radius:10px;padding:0 10px;background:#fff;font-size:14px;min-height:46px}
.ex .row{cursor:pointer;min-height:52px}
.ex .row .e{font-size:12px;color:var(--mut)}
.edit .row button{color:var(--r);font-size:14px;min-width:52px;min-height:44px}
.note{color:#555;font-size:13px;padding:4px 14px}

<body>
<div id="app">
  <header><button class="hb" id="hl"></button><h1 id="ttl">筋トレ</h1><div class="hb" id="hr" style="justify-content:flex-end"></div></header>
  <main id="main"></main>
  <div id="act"></div>
  <nav id="nav">
    <button data-t="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>ホーム</button>
    <button data-t="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>ふり返り</button>
    <button data-t="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9a4 4 0 016 0l-3 3"/></svg>体重</button>
    <button data-t="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>設定</button>
  </nav>
</div>
<aside id="formv"><img id="fimg" alt=""><div class="fm" id="fmsg"></div></aside>
<div id="toast"></div>
<script>
'use strict';
// ===== データ（このスマホの中だけに保存） =====
// 保存の形：{ex:[{id,part,name}], days:{'YYYY-MM-DD':[{ex,sets:[{w,r,done}]}]}, body:[{d,w,f}], unit, rest, seq, ver}
// w が '' のセットは「自重（重さ無し）」として残す
const KEY='kintore_v1';
const DEF_EX=[['胸','ベンチプレス'],['胸','ダンベルベンチプレス'],['胸','ダンベルフライ'],['胸','インクラインダンベルプレス'],['胸','ディップス'],
 ['背中','パラレルチンニング'],['背中','リバースダンベルフライ'],['背中','リバースグリップチンニング'],['背中','ルーマニアンデッドリフト'],
 ['肩','ダンベルショルダープレス'],['肩','サイドレイズ'],['肩','ショルダープレス'],['腕','ダンベルカール'],['腕','アームカール'],['腕','OHエクステンション'],
 ['腹','クランチ'],['脚','スクワット'],['脚','ブルガリアンスクワット'],['尻','ヒップスラスト']];
// v2 で足した種目（ジムのマシンと自宅の自重）。同じ名前が無い時だけ足す
const ADD_EX=[['胸','チェストプレス'],['胸','腕立て伏せ'],['背中','ラットプルダウン'],['脚','レッグプレス']];
const PARTS=['胸','背中','肩','腕','腹','脚','尻','その他'];
const VER=2;
let D=load();
function load(){let raw=null;try{raw=localStorage.getItem(KEY);const d=JSON.parse(raw);if(d&&d.ex&&d.days)return migrate(d,raw);}catch(e){}
  const d={ex:DEF_EX.map((x,i)=>({id:'e'+i,part:x[0],name:x[1]})),days:{},body:[],unit:'kg',rest:60,seq:DEF_EX.length,ver:1};return migrate(d,null);}
// 古い形を読んで今の形に移す（元の記録は消さず、移す前の中身を控えとして別の場所に1回だけ残す）
function migrate(d,raw){// 入力の途中で閉じた時の印が残っとったら外す（記録そのものは残す）
  for(const k in d.days)(d.days[k]||[]).forEach(x=>{delete x._new;});
  const v=d.ver||1;if(v>=VER)return d;
  if(raw){try{if(!localStorage.getItem(KEY+'_before_v'+VER))localStorage.setItem(KEY+'_before_v'+VER,raw);}catch(e){}}
  if(v<2){d.body=d.body||[];d.unit=d.unit||'kg';d.rest=d.rest||60;d.seq=Math.max(d.seq||0,d.ex.length);
    const nm=new Set(d.ex.map(e=>norm(e.name)));
    ADD_EX.forEach(x=>{if(!nm.has(norm(x[1])))d.ex.push({id:'e'+(d.seq++),part:x[0],name:x[1]});});}
  d.ver=VER;try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}return d;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast('保存できんかった（空き容量を確かめて）');}coachLater();}
// 受け取った中身を入れ直す時だけ使う＝「直した」印を付けん（付けると、受け取った物をそのまま送り返してしまう）
function saveQuiet(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
// ===== 専属コーチ班へ送る（記録を直すたびに中身まるごとを社長のオフィスへ。圏外なら次に開いた時に送る） =====
const CKEY='kintore_coach',CURL='https://mado.fiveringstokyo.com/kintore/sync';
// 👇 どの機械でも同じ記録にする（社長決裁 2026-10-06「同じにする」）＝開いた時に向こうの最新を取りに行く
const PURL='https://mado.fiveringstokyo.com/kintore/latest';
function coach(){try{return JSON.parse(localStorage.getItem(CKEY))||{};}catch(e){return {};}}
function coachPut(c){try{localStorage.setItem(CKEY,JSON.stringify(c));}catch(e){}}
let coachT=0;
function coachLater(){const c=coach();if(!c.key)return;c.dirty=1;coachPut(c);clearTimeout(coachT);coachT=setTimeout(coachSend,4000);}
async function coachSend(force){const c=coach();if(!c.key||(!c.dirty&&!force))return;clearTimeout(coachT);
  try{const r=await fetch(CURL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:c.key,data:D}),keepalive:JSON.stringify(D).length<60000});
    const j=await r.json();const c2=coach();if(j.ok){c2.dirty=0;c2.last=j.at;c2.err='';c2.rev=String(j.rev||j.at||'');}else c2.err=j.badkey?'合言葉がちがう':'受け取れんかった';coachPut(c2);return j.ok;}
  catch(e){const c2=coach();c2.err='つながらん（あとで送る）';coachPut(c2);return false;}}
// ===== 向こう（他の機械で付けた記録）を受け取る＝スマホもパソコンも同じ中身にする =====
// ・こっちに送ってない書き込みが無ければ、向こうの中身にまるごと入れ替える（消した分もそのまま伝わる）
// ・両方で書いとった時だけ足し合わせる（どっちの記録も消さんのを優先）
async function coachPull(){const c=coach();if(!c.key)return false;
  try{const r=await fetch(PURL+'?key='+encodeURIComponent(c.key),{cache:'no-store'});
    const j=await r.json();
    if(!j||!j.ok||!j.data||!j.data.days){if(j&&j.badkey){const cb=coach();cb.err='合言葉がちがう';coachPut(cb);}return false;}
    const rev=String(j.rev||j.at||'');const c2=coach();
    if(c2.dirty){const m=mergeData(D,j.data);if(m.changed){D=m.d;saveQuiet();}await coachSend(true);return m.changed;}
    if(rev&&rev===c2.rev)return false;
    D=migrate(j.data,null);saveQuiet();c2.rev=rev;c2.last=j.at||c2.last;c2.err='';c2.dirty=0;coachPut(c2);return true;}
  catch(e){return false;}}
// 足し合わせ＝種目は「名前」で突き合わせる（機械ごとに番号が違うため）。日ごとに、向こうにしか無い物を足す
function mergeData(a,b){const d=JSON.parse(JSON.stringify(a));let changed=false;
  d.seq=Math.max(d.seq||0,d.ex.length);
  const byName=new Map(d.ex.map(e=>[norm(e.name),e]));const map={};
  (b.ex||[]).forEach(e=>{const k=norm(e.name);let m=byName.get(k);
    if(!m){m={id:'e'+(d.seq++),part:e.part||'その他',name:e.name};if(e.u)m.u=e.u;d.ex.push(m);byName.set(k,m);changed=true;}
    map[e.id]=m.id;});
  for(const day in (b.days||{})){
    const theirs=(b.days[day]||[]).map(x=>({ex:map[x.ex]||x.ex,sets:(x.sets||[]).map(s=>({w:s.w,r:s.r,done:!!s.done}))}));
    if(!d.days[day]||!d.days[day].length){if(theirs.length){d.days[day]=theirs;changed=true;}continue;}
    theirs.forEach(t=>{const mine=d.days[day].find(x=>x.ex===t.ex);
      if(!mine){d.days[day].push(t);changed=true;return;}
      if(t.sets.length>mine.sets.length){mine.sets=t.sets;changed=true;}});}
  const bd=new Set((d.body||[]).map(x=>x.d));
  (b.body||[]).forEach(x=>{if(!bd.has(x.d)){d.body=d.body||[];d.body.push(x);bd.add(x.d);changed=true;}});
  if(d.body)d.body.sort((p,q)=>p.d<q.d?-1:1);
  return {d:d,changed:changed};}
// 送る＋受け取るを1回で
async function coachSync(){await coachSend();const got=await coachPull();if(got)render();return got;}
addEventListener('online',()=>coachSync());
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')coachSend();
  else coachPull().then(got=>{if(got){render();toast('他の機械の記録と合わせた');}});});
function norm(s){return String(s).replace(/[\s・ー\-]/g,'').replace(/[ぁ-ん]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).toLowerCase();}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const md=k=>(+k.slice(5,7))+'/'+(+k.slice(8));
const wd=k=>'日月火水木金土'[new Date(k+'T12:00').getDay()];
const dTitle=k=>`${+k.slice(5,7)}月${+k.slice(8)}日（${wd(k)}）`+(k===today()?' 今日':ago(k)==='昨日'?' 昨日':'');
const exById=id=>D.ex.find(e=>e.id===id);
// 推定MAX（1回だけ挙がる重さの目安）＝重さ×(1+回数/40)
const rm=(w,r)=>w&&r?w*(1+r/40):0;
const vol=s=>(+s.w||0)*(+s.r||0);
const isSec=id=>(exById(id)||{}).u==='秒';   // 秒で数える種目（プランクなど）
const cnt=id=>isSec(id)?'秒':'回';
const xVol=x=>isSec(x.ex)?0:x.sets.reduce((b,s)=>b+vol(s),0);
const dayVol=d=>(D.days[d]||[]).reduce((a,x)=>a+xVol(x),0);
const kg2=w=>D.unit==='lbs'?w*2.20462:w;      // 表示用
const fromU=w=>D.unit==='lbs'?w/2.20462:w;   // 入力→kg
const f1=n=>(Math.round(n*10)/10).toString();
const t=n=>n>=1000?(n/1000).toFixed(1)+' t':Math.round(n)+' kg';
const wt=s=>s.w===''||s.w==null?'自重':f1(kg2(+s.w))+D.unit;   // 1セットの重さの書き方
const setTxt=(s,id)=>isSec(id)&&(s.w===''||s.w==null)?`${s.r}秒`:`${wt(s)} × ${s.r}${cnt(id)}`;
// 前回の書き方：同じセットが続く所は「×3セット」にまとめる
function grp(sets,id){const o=[];sets.forEach(s=>{const t=setTxt(s,id),l=o[o.length-1];if(l&&l.t===t)l.n++;else o.push({t,n:1});});return o.map(x=>x.t+(x.n>1?` ×${x.n}セット`:'')).join('、');}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200);}
function lastDayOf(exid,before){const ks=Object.keys(D.days).filter(k=>k<before&&D.days[k].some(x=>x.ex===exid)).sort();const k=ks.pop();
  return k?{d:k,it:D.days[k].find(x=>x.ex===exid)}:null;}
// これまでの一番：重さがあるセットは推定MAX、自重のセットは回数（秒）で比べる
const score=(s,bw)=>bw?((s.w===''||!+s.w)?+s.r||0:0):rm(+s.w,+s.r);
function bestSet(exid,exceptDay,bw){let b=null,bv=0,bd='';for(const k in D.days){if(k===exceptDay)continue;for(const x of D.days[k])if(x.ex===exid)for(const s of x.sets){const v=score(s,bw);if(v>bv){bv=v;b=s;bd=k;}}}return {v:bv,s:b,d:bd};}
function lastUsed(exid){let k='';for(const d in D.days)if(d>k&&D.days[d].some(x=>x.ex===exid))k=d;return k;}
function ago(k){if(!k)return '';const d=Math.round((new Date(today()+'T12:00')-new Date(k+'T12:00'))/864e5);return d<=0?'今日':d===1?'昨日':d+'日前';}

// ===== 画面の切り替え =====
let ST={v:'home'};const STACK=[];
function leave(){if(ST.leave){const f=ST.leave;ST.leave=null;f();}}
function go(v,o={},push=true){if(push)STACK.push(ST);ST=Object.assign({v},o);render();}
function back(){leave();ST=STACK.pop()||{v:'home'};render();}
// 下のメニューで飛ぶ時は、途中の画面（種目の入力など）の片付けも全部すませる
function leaveAll(){leave();while(STACK.length){const s=STACK.pop();if(s.leave){const f=s.leave;s.leave=null;f();}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{leaveAll();go(b.dataset.t,{},false);});
function hdr(title,left,right){$('#ttl').textContent=title;const l=$('#hl');l.innerHTML=left?'‹ 戻る':'';l.onclick=left?back:null;$('#hr').innerHTML=right||'';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===({day:'home',pick:'home',ex:'home',newex:'home',rmc:'home',exh:'hist'}[ST.v]||ST.v)));}
function render(){stopFab();showForm();act('');const m=$('#main');m.scrollTop=0;({home,day,pick,ex,newex,hist,exh,body,set,rmc}[ST.v])(m);}
// ===== フォーム解説の絵（パソコン版の右側）＝前に別の日にやった種目だけ出す。絵は専属コーチ班が form/ に置く =====
let FORMS=null;fetch('form/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{FORMS={};for(const k in j)FORMS[norm(k)]=j[k];if(ST&&ST.v==='ex')render();}).catch(()=>{FORMS={};});
function showForm(name,has){const im=$('#fimg'),ms=$('#fmsg');if(!im)return;const f=name&&has&&FORMS&&FORMS[norm(name)];
  if(f){im.src='form/'+f;im.alt=name+' のフォーム';im.style.display='block';ms.textContent='';return;}
  im.style.display='none';im.removeAttribute('src');
  ms.innerHTML=!name?'種目を開くと、ここにフォームの解説が出る<br><small>（前にやった種目だけ）</small>':has?esc(name)+' の解説は準備中<br><small>（次に記録が届いた時に作る）</small>':esc(name)+' は今日が初めて<br><small>次回からここにフォームの解説が出る</small>';}
function act(h){const a=$('#act');a.innerHTML=h;a.style.display=h?'flex':'none';}
let fabEl=null;function stopFab(){if(fabEl){fabEl.remove();fabEl=null;}}
function fab(fn,label){fabEl=document.createElement('button');fabEl.className='fab';fabEl.textContent=label;fabEl.onclick=fn;document.body.appendChild(fabEl);}
function calRows(y,mo,cls){const st=new Date(y,mo,1-new Date(y,mo,1).getDay());let rows='';const td=today();
  for(let w=0;w<6;w++){const d0=new Date(st);d0.setDate(st.getDate()+w*7);if(w>3&&d0.getMonth()!==mo)break;rows+='<tr>';for(let i=0;i<7;i++){const d=new Date(st);d.setDate(st.getDate()+w*7+i);const k=ymd(d);
    rows+=`<td class="${d.getMonth()!==mo?'o':''} ${cls(k)?'done':''} ${k===td?'today':''}" data-d="${k}"><span>${d.getDate()}</span></td>`;}rows+='</tr>';}
  return `<tr>${'日月火水木金土'.split('').map(x=>'<th>'+x+'</th>').join('')}</tr>${rows}`;}

// ===== ホーム =====
let calM=null;
function home(m){hdr('筋トレ');const now=new Date();if(!calM)calM=new Date(now.getFullYear(),now.getMonth(),1);
  const y=calM.getFullYear(),mo=calM.getMonth();const td=today();
  const sumRange=(from,to)=>{let s=0;for(const k in D.days)if(k>=from&&k<=to)s+=dayVol(k);return s;};
  const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d);};
  const v7=sumRange(dAgo(6),td);let s7=0;for(const k in D.days)if(k>=dAgo(6)&&k<=td)D.days[k].forEach(x=>s7+=x.sets.length);
  const mdays=Object.keys(D.days).filter(k=>k.startsWith(y+'-'+pad(mo+1))&&D.days[k].length).length;
  const tdays=Object.keys(D.days).filter(k=>D.days[k].length).length;
  const tdy=D.days[td]||[];
  m.innerHTML=`<div class="hero"><div class="cal"><div class="mon"><button id="pm" aria-label="前の月">‹</button>${y}年${mo+1}月<button id="nm" aria-label="次の月">›</button></div>
   <table>${calRows(y,mo,k=>D.days[k]&&D.days[k].length)}</table></div>
   <div class="stats"><div class="sc"><div class="l">${mo+1}月にやった日</div><div class="v">${mdays}日</div></div>
    <div class="sc"><div class="l">これまで合計</div><div class="v">${tdays}日</div></div>
    ${v7||!s7?`<div class="sc"><div class="l">この7日の総重量</div><div class="v">${t(v7)}</div></div>`:`<div class="sc"><div class="l">この7日のセット</div><div class="v">${s7}</div></div>`}</div></div>
   <div class="pad"><div class="btnrow"><button class="bigbtn" id="add">＋ 今日の記録をつける</button><button class="subbtn" id="rmb">MAX計算</button></div>
   ${tdays>=10&&(!D.lastBackup||ago(D.lastBackup).replace('日前','')>30)?`<button class="lnk" id="bk" style="text-align:left;margin:8px 0 0;width:100%">💾 ${D.lastBackup?'控えを書き出してから30日以上たった':'記録の控えをまだ書き出してない'}（設定から）›</button>`:''}
   ${tdy.length?'<h4 style="margin:14px 2px 0">今日の記録</h4>':''}
   ${tdy.map(x=>{const e=exById(x.ex)||{name:'?'};
     return `<div class="card"><h3 data-ex="${x.ex}">${esc(e.name)}<small>${x.sets.length}セット ›</small></h3>${x.sets.map((s,i)=>`<div class="row"><span class="m">${i+1}</span><span class="n">${setTxt(s,x.ex)}</span></div>`).join('')}</div>`;}).join('')}
   </div>`;
  m.querySelectorAll('.cal td').forEach(c=>c.onclick=()=>go('day',{d:c.dataset.d}));
  m.querySelectorAll('h3[data-ex]').forEach(h=>h.onclick=()=>go('ex',{d:td,ex:h.dataset.ex}));
  if($('#bk'))$('#bk').onclick=()=>{leaveAll();go('set',{},false);};
  $('#pm').onclick=()=>{calM=new Date(y,mo-1,1);render();};$('#nm').onclick=()=>{calM=new Date(y,mo+1,1);render();};
  // 今日まだ何も無い時は、そのまま種目選びへ（戻るとその日の画面）
  $('#add').onclick=()=>{go('day',{d:td});if(!(D.days[td]||[]).length)go('pick',{d:td});};$('#rmb').onclick=()=>go('rmc');}

// ===== その日の記録 =====
function day(m){const d=ST.d;hdr(dTitle(d),true);const L=D.days[d]||[];
  let sets=0,reps=0,v=0,sec=0;L.forEach(x=>{v+=xVol(x);x.sets.forEach(s=>{sets++;if(!isSec(x.ex))reps+=+s.r||0;else sec+=+s.r||0;});});
  m.innerHTML=`<div class="sum4"><div><small>種目</small><b>${L.length}</b></div><div><small>セット</small><b>${sets}</b></div><div><small>回数</small><b>${reps}</b></div>${!v&&sec?`<div><small>秒数</small><b>${sec}</b></div>`:`<div><small>総重量 ${D.unit}</small><b>${Math.round(kg2(v))}</b></div>`}</div>
   <div class="pad">${L.length?L.map((x,i)=>{const e=exById(x.ex)||{name:'?'};return `<div class="card"><h3 data-i="${i}">${esc(e.name)}<small>なおす ›</small></h3>${x.sets.map((s,j)=>`<div class="row"><span class="m">${j+1}</span><span class="n">${setTxt(s,x.ex)}</span></div>`).join('')}</div>`;}).join('')
   :'<div class="empty">この日の記録はまだ無い</div><button class="btn" id="addx" style="width:100%;margin:0">＋ 種目を足す</button>'}</div>`;
  m.querySelectorAll('h3[data-i]').forEach(h=>h.onclick=()=>go('ex',{d,ex:L[+h.dataset.i].ex}));
  if($('#addx'))$('#addx').onclick=()=>go('pick',{d});else fab(()=>go('pick',{d}),'＋ 種目を足す');}

// ===== 種目を選ぶ（最近やった部位が上・検索あり） =====
function pick(m){hdr('種目を選ぶ',true,'<button class="hb" id="ed" style="color:#fff;justify-content:flex-end">'+(ST.edit?'完了':'編集')+'</button>');
  const q=ST.q||'';const parts=[...new Set([...PARTS,...D.ex.map(e=>e.part)])];
  const groups=parts.map(p=>{const es=D.ex.filter(e=>e.part===p&&(!q||norm(e.name).includes(norm(q))));
    es.sort((a,b)=>(lastUsed(b.id)||'').localeCompare(lastUsed(a.id)||'')||a.name.localeCompare(b.name,'ja'));
    return {p,es,lu:es.reduce((a,e)=>{const l=lastUsed(e.id);return l>a?l:a;},'')};}).filter(g=>g.es.length);
  groups.sort((a,b)=>b.lu.localeCompare(a.lu));
  m.innerHTML=`<div class="search"><input id="q" placeholder="種目をさがす" value="${esc(q)}"><button id="nw">＋新しい種目</button></div>
   <div class="pad ${ST.edit?'edit':'ex'}" style="padding-top:0">${groups.map(g=>`<div class="card"><h3>${esc(g.p)}<small>${g.lu?ago(g.lu):''}</small></h3>
   ${g.es.map(e=>`<div class="row" data-id="${e.id}"><span class="n">${esc(e.name)}</span>${ST.edit?'<button data-u="'+e.id+'">'+cnt(e.id)+'で数える</button><button data-r="'+e.id+'">名前</button><button data-x="'+e.id+'">消す</button>':'<span class="e">'+ago(lastUsed(e.id))+'</span>'}</div>`).join('')}</div>`).join('')||`<div class="empty">「${esc(q)}」は見つからん</div><button class="btn" id="nw2">「${esc(q)}」を新しい種目として足す</button>`}</div>`;
  const qi=$('#q');qi.oninput=()=>{ST.q=qi.value;const p=qi.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p);};
  $('#nw').onclick=()=>go('newex',{d:ST.d,name:q});if($('#nw2'))$('#nw2').onclick=$('#nw').onclick;$('#ed').onclick=()=>{ST.edit=!ST.edit;render();};
  if(ST.edit){m.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const e=exById(b.dataset.u);if(e.u==='秒')delete e.u;else e.u='秒';save();toast(e.name+' は'+cnt(e.id)+'で数える');render();});
    m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const e=exById(b.dataset.r);const n=prompt('新しい名前',e.name);if(n&&n.trim()){e.name=n.trim();save();render();}});
    m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const e=exById(b.dataset.x);const used=Object.values(D.days).some(L=>L.some(x=>x.ex===e.id));
      if(used){toast('記録がある種目は消せん（名前の変更はできる）');return;}if(confirm(e.name+' を消す？')){D.ex=D.ex.filter(x=>x!==e);save();render();}});}
  else m.querySelectorAll('.row[data-id]').forEach(r=>r.onclick=()=>toEx(ST.d,r.dataset.id,1));}
function toEx(d,id,n){for(let i=0;i<n;i++)ST=STACK.pop();go('ex',{d,ex:id});}

// ===== 新しい種目（同じ名前があったら止める） =====
function newex(m){hdr('新しい種目',true);const parts=[...new Set([...PARTS,...D.ex.map(e=>e.part)])];
  m.innerHTML=`<div class="form"><label><span>種目名</span><input id="nm" value="${esc(ST.name||'')}" placeholder="例：レッグカール"></label>
   <label><span>部位</span><select id="pt">${parts.map(p=>`<option>${esc(p)}</option>`).join('')}<option value="*">＋新しい部位…</option></select></label>
   <label><span>数え方</span><select id="cu"><option value="回">回数（腕立て・ベンチなど）</option><option value="秒">秒数（プランクなど）</option></select></label></div><div class="warn" id="wn"></div><div class="sugg" id="sg"></div>
   <button class="btn" id="ok">登録してこの種目を記録</button>`;
  const nm=$('#nm'),pt=$('#pt');pt.value='その他';
  pt.onchange=()=>{if(pt.value==='*'){const p=prompt('部位の名前');if(p&&p.trim()){const o=document.createElement('option');o.textContent=p.trim();pt.insertBefore(o,pt.lastChild);pt.value=p.trim();}else pt.value=parts[0];}};
  const chk=()=>{const v=norm(nm.value);const hit=v?D.ex.filter(e=>norm(e.name).includes(v)||v.includes(norm(e.name))):[];
    $('#wn').textContent=hit.length?'似た種目がもうある＝押すとそっちを使う':'';
    $('#sg').innerHTML=hit.slice(0,5).map(e=>`<button data-id="${e.id}">${esc(e.part)}｜${esc(e.name)}</button>`).join('');
    $('#sg').querySelectorAll('button').forEach(b=>b.onclick=()=>toEx(ST.d,b.dataset.id,2));};
  nm.oninput=chk;chk();setTimeout(()=>nm.focus(),50);
  $('#ok').onclick=()=>{const n=nm.value.trim();if(!n){toast('種目名を入れて');return;}
    const same=D.ex.find(e=>norm(e.name)===norm(n));if(same){toast('同じ名前がある＝そっちを使う');toEx(ST.d,same.id,2);return;}
    const e={id:'e'+(D.seq++),part:pt.value,name:n};if($('#cu').value==='秒')e.u='秒';D.ex.push(e);save();toEx(ST.d,e.id,2);};}

// ===== 種目の記録（セット入力・タイマー・前回・自己ベスト） =====
let TM={end:0,iv:null};
const tLeft=()=>Math.max(0,Math.ceil((TM.end-Date.now())/1000));
const mmss=n=>Math.floor(n/60)+':'+pad(n%60);
function ex(m){const d=ST.d,e=exById(ST.ex);hdr(e.name,true);
  D.days[d]=D.days[d]||[];let it=D.days[d].find(x=>x.ex===e.id);
  const prev=lastDayOf(e.id,d);
  if(!it){it={ex:e.id,sets:prev?prev.it.sets.map(s=>({w:s.w,r:s.r,done:false})):[{w:'',r:'',done:false}]};D.days[d].push(it);it._new=true;}
  let pr=ST.pr||null;
  const dl=d===today()?'今日':'この日';const hasHist=Object.keys(D.days).some(k=>k!==d&&D.days[k].some(x=>x.ex===e.id));showForm(e.name,hasHist);
  const draw=()=>{const best=bestSet(e.id,d);const todayMax=isSec(e.id)?0:Math.max(0,...it.sets.map(s=>rm(+s.w,+s.r)));
    m.innerHTML=`<div class="tbar ${TM.iv?'run':''}"><div class="tim"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e52b2f" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
      <b id="tb">${mmss(TM.iv?tLeft():D.rest)}</b><button class="pill" id="tm">−15秒</button><button class="pill" id="tp">＋15秒</button></div><button class="pill f" id="ts">${TM.iv?'止める':'休憩'}</button></div>
    ${pr?`<div class="prb">🏆 <b>自己ベスト更新！</b><br>${dl} <b>${setTxt(pr.s,e.id)}</b>（これまでの一番：${pr.b?setTxt(pr.b,e.id)+'・'+md(pr.d):'なし'}）</div>`:''}
    ${prev||hasHist?`<div class="last">${prev?`<b>前回 ${md(prev.d)}（${ago(prev.d)}）</b><br>${grp(prev.it.sets,e.id)}`:''}${hasHist?`<button class="lnk" id="hx">これまでの記録 ›</button>`:''}</div>`:''}
    <div class="card" style="margin:10px 10px 4px">${it.sets.map((s,i)=>`<div class="setrow ${s.done?'dn':''}"><span class="no">${i+1}</span>
      <div class="stp"><button data-a="w-" data-i="${i}" aria-label="重さを減らす">−</button><input inputmode="decimal" data-f="w" data-i="${i}" value="${s.w===''?'':f1(kg2(+s.w))}" placeholder="自重"><button data-a="w+" data-i="${i}" aria-label="重さを増やす">＋</button></div><span class="u">${D.unit}</span>
      <div class="stp"><button data-a="r-" data-i="${i}" aria-label="回数を減らす">−</button><input inputmode="numeric" data-f="r" data-i="${i}" value="${s.r}" placeholder="${cnt(e.id)}" style="width:40px"><button data-a="r+" data-i="${i}" aria-label="回数を増やす">＋</button></div>
      <button class="chk ${s.done?'on':''}" data-c="${i}" aria-label="できた">✓</button></div>`).join('')}
      <div class="setbtns"><button id="as">＋ セットを足す</button><button id="rs">最後のセットを消す</button></div></div>
    <div class="hint">✓ を押すと休憩タイマーが動いて、次のセットが足される（使わんかった分は保存の時に消える）</div>
    ${todayMax?`<div class="maxl">推定MAX（1回だけ挙がる重さの目安）　${dl} <b>${f1(kg2(todayMax))}${D.unit}</b>${best.v?`／${d===today()?'これまで':'ほかの日'}の一番 ${f1(kg2(best.v))}${D.unit}`:''}</div>`:''}
    <div style="height:8px"></div>`;
    act(`<button class="btn w" id="nx">次の種目へ</button><button class="btn" id="dn">保存して戻る</button>`);
    if($('#hx'))$('#hx').onclick=()=>go('exh',{ex:e.id});
    $('#tm').onclick=()=>{D.rest=Math.max(15,D.rest-15);if(TM.iv)TM.end=Math.max(Date.now()+1000,TM.end-15000);save();draw();};
    $('#tp').onclick=()=>{D.rest+=15;if(TM.iv)TM.end+=15000;save();draw();};
    $('#ts').onclick=()=>{TM.iv?stopT():startT();draw();};
    const follow=(i,f,old)=>{for(let j=i+1;j<it.sets.length;j++){const x=it.sets[j];if(x.done||String(x[f])!==String(old))break;x[f]=it.sets[i][f];}};
    m.querySelectorAll('input[data-f]').forEach(inp=>inp.onchange=()=>{const i=+inp.dataset.i,s=it.sets[i],f=inp.dataset.f,old=s[f];const v=parseFloat(String(inp.value).replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)));
      if(f==='w')s.w=isNaN(v)||v<=0?'':Math.round(fromU(v)*100)/100;else s.r=isNaN(v)?'':Math.max(0,Math.round(v));delete s.auto;follow(i,f,old);commit();draw();});
    m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,s=it.sets[i];const a=b.dataset.a,f=a[0],old=s[f];
      if(f==='w'){const st=D.unit==='lbs'?5:1.25;let v=kg2(+s.w||0)+(a[1]==='+'?st:-st);v=Math.round(fromU(v)*100)/100;s.w=v>0?v:'';}
      else s.r=Math.max(0,(+s.r||0)+(a[1]==='+'?1:-1));delete s.auto;follow(i,f,old);commit();draw();});
    m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.c,s=it.sets[i];s.done=!s.done;delete s.auto;
      if(s.done&&i===it.sets.length-1)it.sets.push({w:s.w,r:s.r,done:false,auto:1});
      if(!s.done&&i===it.sets.length-2&&it.sets[i+1].auto)it.sets.pop();
      commit();if(s.done){startT();checkPR(s);toast((i+1)+'セット目 できた！ 休憩 '+mmss(D.rest));}draw();});
    $('#rs').onclick=()=>{if(it.sets.length<=1){toast('これ以上は消せん');return;}it.sets.pop();commit();draw();};
    $('#as').onclick=()=>{const l=it.sets[it.sets.length-1]||{w:'',r:''};it.sets.push({w:l.w,r:l.r,done:false});commit();draw();};
    $('#dn').onclick=()=>{commit();back();};
    $('#nx').onclick=()=>{commit();back();if(ST.v!=='day')go('day',{d});go('pick',{d});};};
  const commit=()=>{delete it._new;save();};
  // 画面を離れる時：回数の無いセットは残さん。触っとらん新しい種目も残さん
  const cleanup=()=>{const wasNew=it._new;it.sets=it.sets.filter(s=>s.r!==''&&+s.r>0&&!s.auto);if(wasNew||!it.sets.length){D.days[d]=(D.days[d]||[]).filter(x=>x!==it);}
    delete it._new;if(D.days[d]&&!D.days[d].length)delete D.days[d];save();
    if(!wasNew&&it.sets.length)toast(e.name+' を保存した');};
  ST.leave=cleanup;
  const checkPR=s=>{const bw=s.w===''||!+s.w;const b=bestSet(e.id,d,bw);const v=score(s,bw);const cur=Math.max(0,...it.sets.filter(x=>x!==s&&x.done).map(x=>score(x,bw)));
    if(b.v>0&&v>b.v&&v>cur){pr={s:{w:s.w,r:s.r},b:b.s,d:b.d};ST.pr=pr;try{navigator.vibrate&&navigator.vibrate(200);}catch(_){}}};
  draw();}
function startT(){stopT();audioOn();TM.end=Date.now()+D.rest*1000;TM.iv=setInterval(()=>{const l=tLeft();const b=$('#tb');if(b)b.textContent=mmss(l);
  if(l<=0){stopT();try{navigator.vibrate&&navigator.vibrate([300,100,300]);beep();}catch(e){}toast('休憩おわり');const tb=document.querySelector('.tbar');if(tb)tb.classList.remove('run');const s=$('#ts');if(s)s.textContent='休憩';if(b)b.textContent=mmss(D.rest);}},250);}
function stopT(){clearInterval(TM.iv);TM.iv=null;}
let AC=null;function audioOn(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){const c=AC;if(!c)return;[0,.35].forEach(t0=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.value=.2;o.start(c.currentTime+t0);o.stop(c.currentTime+t0+.2);});}

// ===== ふり返り（カレンダー・グラフ） =====
let hM=null;
function hist(m){hdr('ふり返り');const mode=ST.mode||'cal',part=ST.part||'ALL';const parts=['ALL',...new Set(D.ex.map(e=>e.part))];
  let html=`<div class="chips">${parts.map(p=>`<button data-p="${esc(p)}" class="${p===part?'on':''}">${p==='ALL'?'ぜんぶ':esc(p)}</button>`).join('')}</div>
   <div class="seg"><button data-m="cal" class="${mode==='cal'?'on':''}">カレンダー</button><button data-m="graph" class="${mode==='graph'?'on':''}">グラフ</button></div>`;
  const inPart=x=>part==='ALL'||(exById(x.ex)||{}).part===part;
  const hit=k=>(D.days[k]||[]).some(inPart);
  if(mode==='cal'){const n=new Date();if(!hM)hM=new Date(n.getFullYear(),n.getMonth(),1);const y=hM.getFullYear(),mo=hM.getMonth();
    html+=`<div class="hcal"><div class="mh"><button id="p" aria-label="前の月">‹</button>${y}年${mo+1}月<button id="n" aria-label="次の月">›</button></div><table>${calRows(y,mo,hit)}</table></div>`;
    m.innerHTML=html;m.querySelectorAll('td[data-d]').forEach(c=>c.onclick=()=>go('day',{d:c.dataset.d}));
    $('#p').onclick=()=>{hM=new Date(y,mo-1,1);render();};$('#n').onclick=()=>{hM=new Date(y,mo+1,1);render();};}
  else{// 週ごとの総重量（重さ×回数の合計）を12週ぶん
    const wk=[];const n0=new Date();n0.setHours(12,0,0,0);n0.setDate(n0.getDate()-n0.getDay());
    for(let i=11;i>=0;i--){const s=new Date(n0);s.setDate(n0.getDate()-i*7);const e2=new Date(s);e2.setDate(s.getDate()+6);const a=ymd(s),b=ymd(e2);let v=0;
      for(const k in D.days)if(k>=a&&k<=b)D.days[k].filter(inPart).forEach(x=>x.sets.forEach(st=>v+=vol(st)));wk.push({x:a,y:kg2(v)});}
    html+=`<div class="gbox"><h4>週ごとの総重量（${part==='ALL'?'ぜんぶ':esc(part)}）</h4><div class="chg">重さ×回数の合計。棒が伸びとれば量が増えとる</div>${bars(wk)}</div>`;
    const exs=D.ex.filter(e=>part==='ALL'||e.part===part).filter(e=>lastUsed(e.id)).sort((a,b)=>lastUsed(b.id).localeCompare(lastUsed(a.id))).slice(0,8);
    exs.forEach(e=>html+=exCard(e,true));
    m.innerHTML=html;m.querySelectorAll('.gbox[data-ex]').forEach(g=>g.onclick=()=>go('exh',{ex:g.dataset.ex}));}
  m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ST.part=b.dataset.p;render();});
  m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ST.mode=b.dataset.m;render();});}
// 種目ごとの伸び（重さがある種目は推定MAX、自重・秒の種目は1セットの最高回数・秒数）
function exPts(e){const ks=Object.keys(D.days).sort().filter(k=>D.days[k].some(x=>x.ex===e.id));
  const pts=ks.map(k=>{const S=D.days[k].find(x=>x.ex===e.id).sets;return {x:k,y:kg2(Math.max(0,...S.map(s=>rm(+s.w,+s.r)))),reps:Math.max(0,...S.map(s=>+s.r||0))};});
  const wb=isSec(e.id)||pts.every(p=>!p.y);return {wb,u:wb?cnt(e.id):D.unit,P:wb?pts.map(p=>({x:p.x,y:p.reps})):pts};}
function exCard(e,link){const {wb,u,P:all}=exPts(e);const P=all.slice(-30);const ch=P.length>1?P[P.length-1].y-P[0].y:0;
  return `<div class="gbox" ${link?`data-ex="${e.id}"`:''}><h4>${esc(e.name)}｜${wb?'1セットの最高'+(isSec(e.id)?'秒数':'回数'):'推定MAX'}</h4>
    <div class="chg">${P.length>1?`${md(P[0].x)} ${f1(P[0].y)}${u} → ${md(P[P.length-1].x)} ${f1(P[P.length-1].y)}${u}　<b class="${ch<0?'dn':''}">${ch>=0?'+':''}${f1(ch)}${u}</b>`:'記録が2回以上になると伸びが出る'}</div>${line(P)}${link?'<div class="more">日ごとの記録を見る ›</div>':''}</div>`;}

// ===== 種目ごとの記録の一覧 =====
function exh(m){const e=exById(ST.ex);hdr(e.name,true);const {wb,u,P}=exPts(e);const top=Math.max(0,...P.map(p=>p.y));
  m.innerHTML=exCard(e,false)+`<div class="pad" style="padding-top:0"><div class="card">${P.slice().reverse().map(p=>{const x=D.days[p.x].find(y=>y.ex===e.id);
    return `<div class="row" data-d="${p.x}" style="padding:8px 12px"><span class="n"><b>${md(p.x)}（${wd(p.x)}）</b>${p.y===top&&top>0?' 🏆':''}<br><span class="m">${grp(x.sets,e.id)}</span></span><span style="white-space:nowrap">${f1(p.y)}${u} ›</span></div>`;}).join('')}</div>
    <div class="note">右の数字は${wb?'その日の1セットの最高'+(isSec(e.id)?'秒数':'回数'):'その日の推定MAX（1回だけ挙がる重さの目安）'}。🏆 は一番よかった日。押すとその日の記録を開く</div></div>`;
  m.querySelectorAll('.row[data-d]').forEach(r=>r.onclick=()=>go('day',{d:r.dataset.d}));}
function bars(pts){const W=340,H=150,L=34,B=20,T=10;const mx=Math.max(1,...pts.map(p=>p.y));const bw=(W-L-4)/pts.length;
  let s=`<svg class="g" viewBox="0 0 ${W} ${H}" style="height:150px">`;
  for(let g=0;g<=2;g++){const v=mx*g/2,yy=T+(1-g/2)*(H-T-B);s+=`<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="#eee"/><text x="${L-4}" y="${yy+3}" font-size="9" text-anchor="end" fill="#999">${v>=1000?(v/1000).toFixed(1)+'t':Math.round(v)}</text>`;}
  pts.forEach((p,i)=>{const h=p.y/mx*(H-T-B);s+=`<rect x="${L+i*bw+2}" y="${H-B-h}" width="${bw-4}" height="${h}" rx="2" fill="${i===pts.length-1?'#e52b2f':'#f2a0a2'}"/>`;});
  s+=`<text x="${L}" y="${H-5}" font-size="9" fill="#999">${md(pts[0].x)}週</text><text x="${W}" y="${H-5}" font-size="9" fill="#999" text-anchor="end">今週</text></svg>`;return s;}
function line(pts){if(pts.length<1)return '<div class="empty" style="padding:20px">まだ記録が無い</div>';
  const W=340,H=170,L=34,R=8,T=12,B=22;const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx===mn){mx+=1;mn=Math.max(0,mn-1);}
  const X=i=>L+(pts.length===1?(W-L-R)/2:i*(W-L-R)/(pts.length-1)),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let s=`<svg class="g" viewBox="0 0 ${W} ${H}">`;for(let g=0;g<=3;g++){const v=mn+(mx-mn)*g/3;s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eee"/><text x="${L-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="#999">${Math.round(v*10)/10}</text>`;}
  s+=`<polyline fill="none" stroke="#e52b2f" stroke-width="2" points="${pts.map((p,i)=>X(i)+','+Y(p.y)).join(' ')}"/>`;
  pts.forEach((p,i)=>s+=`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="#e52b2f"/>`);
  s+=`<text x="${L}" y="${H-6}" font-size="9" fill="#999">${md(pts[0].x)}</text><text x="${W-R}" y="${H-6}" font-size="9" fill="#999" text-anchor="end">${md(pts[pts.length-1].x)}</text></svg>`;return s;}

// ===== 体重・体脂肪 =====
function body(m){hdr('体重・体脂肪');const b=[...D.body].sort((a,c)=>a.d.localeCompare(c.d));const last=b[b.length-1]||{};
  m.innerHTML=`<div class="form"><label><span>日付</span><input type="date" id="bd" value="${today()}"></label><label><span>体重 kg</span><input id="bw" inputmode="decimal" value="${last.w||''}"></label>
   <label><span>体脂肪 %</span><input id="bf" inputmode="decimal" value="${last.f||''}"></label></div><button class="btn" id="bs">記録する</button>
   <div class="gbox"><h4>体重</h4>${line(b.filter(x=>x.w).slice(-60).map(x=>({x:x.d,y:+x.w})))}</div><div class="gbox"><h4>体脂肪率</h4>${line(b.filter(x=>x.f).slice(-60).map(x=>({x:x.d,y:+x.f})))}</div>
   <div class="pad">${b.slice(-15).reverse().map(x=>`<div class="row" style="background:#fff"><span class="n">${x.d}</span><span>${x.w||'-'} kg</span><span class="m">${x.f||'-'} %</span><button class="del" data-d="${x.d}" aria-label="消す">×</button></div>`).join('')}</div>`;
  $('#bs').onclick=()=>{const d=$('#bd').value,w=parseFloat($('#bw').value),f=parseFloat($('#bf').value);if(!d||(isNaN(w)&&isNaN(f)))return toast('体重か体脂肪を入れて');
    D.body=D.body.filter(x=>x.d!==d);D.body.push({d,w:isNaN(w)?'':w,f:isNaN(f)?'':f});save();toast('記録した');render();};
  m.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{if(confirm(x.dataset.d+' の記録を消す？')){D.body=D.body.filter(y=>y.d!==x.dataset.d);save();render();}});}

// ===== MAX計算（重さと回数から、1回だけ挙がる重さの目安を出す） =====
function rmc(m){hdr('MAX計算',true);m.innerHTML=`<div class="note">できた重さと回数を入れると、1回だけ挙がる重さ（推定MAX）と、何回なら何kgできそうかの目安が出る。</div><div class="form"><label><span>重さ ${D.unit}</span><input id="w" inputmode="decimal"></label><label><span>回数</span><input id="r" inputmode="numeric"></label></div><div class="card" style="margin:10px" id="out"></div>`;
  const up=()=>{const w=parseFloat($('#w').value),r=parseInt($('#r').value);if(!w||!r){$('#out').innerHTML='';return;}const one=w*(1+r/40);
    $('#out').innerHTML=[1,2,3,5,8,10,12,15].map(n=>`<div class="row"><span class="n">${n} 回できる重さ</span><b>${f1(one/(1+n/40))} ${D.unit}</b>${n===1?'<span class="m">＝推定MAX</span>':''}</div>`).join('');};
  $('#w').oninput=up;$('#r').oninput=up;}

// ===== 設定（控え・引っ越し） =====
function set(m){hdr('設定');const n=Object.keys(D.days).length;
  m.innerHTML=`<div class="form"><label><span>重さの単位</span><select id="un"><option value="kg">kg</option><option value="lbs">lbs（ポンド）</option></select></label>
   <label><span>休憩（秒）</span><input id="rs" inputmode="numeric" value="${D.rest}"></label></div>
   <div class="pad" style="color:#666;font-size:13px">記録はこのスマホの中だけにある（${n}日分）。機種変更やもしもの時のために、ときどき「控えを書き出す」でファイルに残して。<br><b>最後に控えを書き出した日：${D.lastBackup?md(D.lastBackup)+'（'+ago(D.lastBackup)+'）':'まだ無い'}</b></div>
   <div class="pad" style="font-size:13px"><b>コーチ班とつなぐ（どの機械でも同じ記録）</b><br><span style="color:#666">記録を直すたびにコーチ班へ自動で届く。開いた時は向こうの最新を受け取るから、スマホとパソコンのどっちで付けても同じ中身になる（圏外なら次に開いた時）。合言葉は一度入れたら覚えとく。</span></div>
   <div class="form"><label><span>合言葉</span><input id="ck" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(coach().key||'')}" placeholder="kt-…"></label></div>
   <div class="pad" id="cst" style="color:#666;font-size:13px">${coach().key?(coach().last?'最後に届いた：'+esc(coach().last):'まだ届いてない')+(coach().err?'　⚠'+esc(coach().err):''):'まだつないでない'}</div>
   <button class="btn w" id="cs">いま合わせる（送る＋受け取る）</button>
   <button class="btn" id="ex">控えを書き出す（ファイル）</button><button class="btn w" id="im">控えから読み込む</button><input type="file" id="fi" accept=".json,application/json" style="display:none">`;
  $('#un').value=D.unit;$('#un').onchange=()=>{D.unit=$('#un').value;save();};$('#rs').onchange=()=>{D.rest=Math.max(10,parseInt($('#rs').value)||60);save();};
  $('#ex').onclick=async()=>{const txt=JSON.stringify(D);const name='kintore_'+today()+'.json';const file=new File([txt],name,{type:'application/json'});
    const done=()=>{D.lastBackup=today();save();render();};
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});done();return;}catch(e){if(e&&e.name==='AbortError')return;}}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();done();};
  $('#ck').onchange=()=>{const c=coach();c.key=$('#ck').value.trim();c.dirty=1;c.err='';coachPut(c);};
  $('#cs').onclick=async()=>{const c=coach();c.key=$('#ck').value.trim();coachPut(c);if(!c.key){toast('合言葉を入れて');return;}
    $('#cs').disabled=true;const ok=await coachSend(true);const got=await coachPull();
    toast(ok?(got?'合わせた（向こうの記録も受け取った）':'コーチ班に届いた'):'⚠'+(coach().err||'送れんかった'));render();};
  $('#im').onclick=()=>$('#fi').click();
  $('#fi').onchange=async()=>{const f=$('#fi').files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.ex||!d.days)throw 0;
    if(confirm('今の記録を、この控えの中身に入れ替える？')){localStorage.setItem(KEY+'_before_import',JSON.stringify(D));D=migrate(d,null);save();toast('読み込んだ');render();}}catch(e){toast('この控えは読めん');}};}

// 記録をスマホに消されにくくする（使えるブラウザだけ）
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
// デスクトップ（ESPERのモニター）から #key=… 付きで開いた時＝合言葉を自動で覚える。覚えたらURLからは消す
try{const m=(location.hash||'').match(/key=([A-Za-z0-9._-]+)/);
  if(m){const c=coach();if(c.key!==m[1]){c.key=m[1];c.err='';c.rev='';coachPut(c);}
    history.replaceState(null,'',location.pathname+location.search);}}catch(e){}
render();
coachSync();
</script>
</body>
</html>
